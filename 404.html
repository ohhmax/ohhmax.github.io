<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404: Page Not Found | Mahendra Mali (Max)</title>
  <meta name="description" content="Requested page not found on Mahendra Mali's portfolio.">
  <meta name="theme-color" content="#09090b">

  <!-- Favicons -->
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="./assets/img/logo/icon-64x64.png" type="image/x-icon">

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121214;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --btn-bg: #ffffff;
      --btn-text: #000000;
      --btn-hover: #e4e4e7;
      --code-bg: rgba(255, 255, 255, 0.08);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f4f5;
        --card-bg: #ffffff;
        --border: #e4e4e7;
        --text: #18181b;
        --text-muted: #52525b;
        --text-dim: #71717a;
        --btn-bg: #18181b;
        --btn-text: #ffffff;
        --btn-hover: #27272a;
        --code-bg: rgba(0, 0, 0, 0.06);
      }
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }

    .error-container {
      max-width: 540px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .error-header-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .error-code {
      font-family: var(--font-mono);
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
      color: var(--text);
      margin-bottom: 8px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .error-path-chip {
      display: inline-block;
      max-width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      word-break: break-all;
      margin-bottom: 28px;
    }

    .error-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 14px;
      font-weight: 700;
      padding: 14px 22px;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--btn-hover);
      transform: translateY(-2px);
    }

    .quick-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .quick-links a {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .quick-links a:hover {
      color: var(--text);
    }

    .footer-brand {
      margin-top: 32px;
      font-size: 12px;
      color: var(--text-dim);
    }
  </style>
</head>

<body>
  <main class="error-container">
    <div class="error-header-badge">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span>Page Not Found</span>
    </div>

    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>

    <p class="error-desc">
      The requested page or resource could not be found. You can return back to the main portfolio.
    </p>

    <div class="error-path-chip" id="errorPathChip">Loading route...</div>

    <div class="error-actions">
      <a href="./" class="btn-primary">
        <i class="fa-solid fa-house"></i>
        <span>Return to Home</span>
      </a>
    </div>

    <div class="quick-links">
      <a href="./#projects"><i class="fa-solid fa-layer-group"></i> Projects</a>
      <a href="./#resume"><i class="fa-solid fa-file-lines"></i> Resume</a>
      <a href="cv-resume-latest-info.html"><i class="fa-solid fa-id-card"></i> Modern CV</a>
      <a href="./#contact"><i class="fa-solid fa-paper-plane"></i> Contact</a>
    </div>

    <div class="footer-brand">
      Mahendra Mali (Max) • Full-Stack Developer & MCA Graduate
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const chip = document.getElementById('errorPathChip');
      if (chip) {
        const path = window.location.pathname + window.location.search + window.location.hash;
        chip.textContent = path || '/404';
      }
    });
  </script>
</body>

</html>
