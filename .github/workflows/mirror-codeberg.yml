name: Mirror to Codeberg

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/android-build.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  mirror-codeberg:
    name: Sync Repository to Codeberg Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-pages-cli
        run: |
          curl -sL -o /usr/local/bin/git-pages-cli https://codeberg.org/git-pages/git-pages-cli/releases/download/latest/git-pages-cli.linux-amd64
          chmod +x /usr/local/bin/git-pages-cli
          git-pages-cli --version

      - name: Push Repository and Deploy to Codeberg Pages
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "Error: CODEBERG_TOKEN secret is not configured."
            exit 1
          fi

          TOKEN_CLEAN=$(echo -n "$CODEBERG_TOKEN" | tr -d '\r\n\t ')

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Push complete repository code to Codeberg main branch
          git remote add codeberg "https://ohhmax:${TOKEN_CLEAN}@codeberg.org/ohhmax/pages.git"
          git push --force codeberg main:main
          echo "Successfully mirrored full repository to Codeberg main branch."

          # 2. Build lightweight, quota-compliant distribution for Codeberg Pages (<100 MiB limit)
          mkdir -p /tmp/codeberg-pages
          rsync -avL \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.forgejo' \
            --exclude='portfolio-monitor' \
            --exclude='android' \
            --exclude='backend' \
            --exclude='scratch' \
            --exclude='.playwright-mcp' \
            --exclude='out' \
            --exclude='data/attachments' \
            --exclude='assets/img/gallery/Reel/*.mp4' \
            ./ /tmp/codeberg-pages/

          PAGES_SIZE=$(du -sh /tmp/codeberg-pages | awk '{print $1}')
          echo "Prepared Codeberg Pages distribution size: $PAGES_SIZE"

          # 3. Deploy dedicated single-commit pages branch to Codeberg
          cd /tmp/codeberg-pages
          git init -b pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: update Codeberg Pages static build"
          git remote add codeberg "https://ohhmax:${TOKEN_CLEAN}@codeberg.org/ohhmax/pages.git"
          git push --force codeberg pages:pages
          echo "Successfully deployed clean pages branch to Codeberg."

          # 4. Optional direct deployment via git-pages-cli if token has read:user scope
          cd "$GITHUB_WORKSPACE"
          echo "Attempting optional direct deployment via git-pages-cli..."
          if git-pages-cli https://ohhmax.codeberg.page/ --token="$TOKEN_CLEAN" --upload-dir=/tmp/codeberg-pages --parents -v; then
            echo "Direct static deployment via git-pages-cli succeeded."
          else
            echo "Direct upload skipped or unauthorized; git push to pages branch triggers automated rebuild."
          fi
