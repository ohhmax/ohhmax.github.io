name: Mirror to Codeberg

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/android-build.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  mirror-codeberg:
    name: Sync Repository to Codeberg Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Codeberg Repository
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "Error: CODEBERG_TOKEN secret is not configured."
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add codeberg "https://ohhmax:${CODEBERG_TOKEN}@codeberg.org/ohhmax/pages.git"
          git push --force codeberg main:main
          echo "Successfully mirrored repository to Codeberg (https://codeberg.org/ohhmax/pages)."
