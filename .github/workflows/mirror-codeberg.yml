name: Mirror to Codeberg

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/android-build.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  mirror-codeberg:
    name: Sync Repository to Codeberg Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-pages-cli
        run: |
          curl -sL -o /usr/local/bin/git-pages-cli https://codeberg.org/git-pages/git-pages-cli/releases/download/latest/git-pages-cli.linux-amd64
          chmod +x /usr/local/bin/git-pages-cli
          git-pages-cli --version

      - name: Push Repository and Deploy to Codeberg Pages
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "Error: CODEBERG_TOKEN secret is not configured."
            exit 1
          fi

          TOKEN_CLEAN=$(echo -n "$CODEBERG_TOKEN" | tr -d '\r\n\t ')

          # 1. Push code to Codeberg repository branches
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add codeberg "https://ohhmax:${TOKEN_CLEAN}@codeberg.org/ohhmax/pages.git"
          git push --force codeberg main:main
          git push --force codeberg main:pages
          echo "Successfully mirrored repository to Codeberg branches (main, pages)."

          # 2. Deploy static web files directly to Codeberg Pages via git-pages-cli if authorized
          mkdir -p /tmp/codeberg-dist
          rsync -avL --exclude='.git' --exclude='.github' --exclude='.forgejo' --exclude='portfolio-monitor' --exclude='android' --exclude='backend' --exclude='scratch' --exclude='.playwright-mcp' --exclude='out' --exclude='data/attachments' ./ /tmp/codeberg-dist/

          echo "Attempting direct deployment to Codeberg Pages server via git-pages-cli..."
          if git-pages-cli https://ohhmax.codeberg.page/ --token="$TOKEN_CLEAN" --upload-dir=/tmp/codeberg-dist --parents -v; then
            echo "Direct static deployment via git-pages-cli succeeded."
          else
            echo "Notice: git-pages-cli direct upload requires 'read:user' scope on CODEBERG_TOKEN in addition to 'repo'."
            echo "Dispatching webhook rebuild fallback signal..."
            HOOKS_RES=$(curl -s -H "Authorization: token $TOKEN_CLEAN" "https://codeberg.org/api/v1/repos/ohhmax/pages/hooks")
            HOOK_ID=$(echo "$HOOKS_RES" | jq -r '.[]? | select((.type=="git_pages") or (.type=="git-pages") or (((.config.url // "") | contains("codeberg.page")))) | .id' | head -n 1)
            if [ -n "$HOOK_ID" ] && [ "$HOOK_ID" != "null" ]; then
              curl -s -X POST "https://codeberg.org/api/v1/repos/ohhmax/pages/hooks/$HOOK_ID/tests" -H "Authorization: token $TOKEN_CLEAN" || true
              echo "Rebuild trigger signal dispatched to git-pages webhook."
            fi
          fi
