name: Mirror to Codeberg

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/android-build.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  mirror-codeberg:
    name: Sync Repository to Codeberg Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Complete History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push and Trigger Codeberg Pages Deployment
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "Error: CODEBERG_TOKEN secret is not configured."
            exit 1
          fi

          TOKEN_CLEAN=$(echo -n "$CODEBERG_TOKEN" | tr -d '\r\n\t ')

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add codeberg "https://ohhmax:${TOKEN_CLEAN}@codeberg.org/ohhmax/pages.git"
          git push --force codeberg main:main
          git push --force codeberg main:pages
          echo "Successfully mirrored repository to Codeberg branches (main, pages)."

          # Configure Codeberg git-pages webhook via Forgejo API
          echo "Checking Codeberg repository webhooks..."
          HOOKS_RES=$(curl -s -w "\n%{http_code}" -H "Authorization: token $TOKEN_CLEAN" "https://codeberg.org/api/v1/repos/ohhmax/pages/hooks")
          HTTP_CODE=$(echo "$HOOKS_RES" | tail -n 1)
          HOOKS_BODY=$(echo "$HOOKS_RES" | sed '$d')

          echo "Codeberg hooks query status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            HOOK_ID=$(echo "$HOOKS_BODY" | jq -r '.[]? | select((.type=="git-pages") or ((.config.url // "") | contains("codeberg.page"))) | .id' | head -n 1)

            if [ -z "$HOOK_ID" ] || [ "$HOOK_ID" = "null" ]; then
              echo "No git-pages webhook registered. Creating git-pages webhook..."
              CREATE_RES=$(curl -s -X POST "https://codeberg.org/api/v1/repos/ohhmax/pages/hooks" \
                -H "Authorization: token $TOKEN_CLEAN" \
                -H "Content-Type: application/json" \
                -d '{
                  "type": "git-pages",
                  "config": {
                    "url": "https://ohhmax.codeberg.page",
                    "content_type": "json"
                  },
                  "events": ["push"],
                  "branch_filter": "*",
                  "active": true
                }')
              HOOK_ID=$(echo "$CREATE_RES" | jq -r '.id // empty')
              echo "Created git-pages webhook with ID: $HOOK_ID"
            else
              echo "Active git-pages webhook identified with ID: $HOOK_ID"
              # Verify / update webhook configuration to ensure active push triggers
              HOOK_INFO=$(curl -s -H "Authorization: token $TOKEN_CLEAN" "https://codeberg.org/api/v1/repos/ohhmax/pages/hooks/$HOOK_ID")
              echo "Webhook configuration: $(echo "$HOOK_INFO" | jq -c '{id, type, active, events, branch_filter, config}')"

              PATCH_RES=$(curl -s -X PATCH "https://codeberg.org/api/v1/repos/ohhmax/pages/hooks/$HOOK_ID" \
                -H "Authorization: token $TOKEN_CLEAN" \
                -H "Content-Type: application/json" \
                -d '{
                  "active": true,
                  "events": ["push"],
                  "branch_filter": "*",
                  "config": {
                    "url": "https://ohhmax.codeberg.page",
                    "content_type": "json"
                  }
                }')
              echo "Webhook configuration refreshed."
            fi

            if [ -n "$HOOK_ID" ] && [ "$HOOK_ID" != "null" ]; then
              echo "Dispatching git-pages test event to trigger immediate rebuild..."
              TEST_RES=$(curl -s -w "\n%{http_code}" -X POST "https://codeberg.org/api/v1/repos/ohhmax/pages/hooks/$HOOK_ID/tests" \
                -H "Authorization: token $TOKEN_CLEAN")
              TEST_CODE=$(echo "$TEST_RES" | tail -n 1)
              TEST_BODY=$(echo "$TEST_RES" | sed '$d')
              echo "Rebuild trigger response HTTP $TEST_CODE: $TEST_BODY"
            fi
          else
            echo "Notice: Codeberg hooks API returned HTTP $HTTP_CODE."
          fi
