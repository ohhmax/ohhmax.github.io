name: Deploy Cloudflare Worker Backend

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Deploy Backend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Deploy Worker to Cloudflare
        working-directory: backend
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_TOKEN" ]; then
            echo "Error: CLOUDFLARE_TOKEN secret is not configured."
            exit 1
          fi

          export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_TOKEN"

          # 1. Check if user configured CLOUDFLARE_ACCOUNT_ID secret
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
            echo "Using configured Cloudflare Account ID: ${CLOUDFLARE_ACCOUNT_ID:0:6}***"
          else
            # 2. Attempt dynamic discovery from Cloudflare API
            ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[0].id // empty')
            if [ -n "$ACCOUNT_ID" ] && [ "$ACCOUNT_ID" != "null" ]; then
              echo "Cloudflare Account ID discovered from API: ${ACCOUNT_ID:0:6}***"
              export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
            else
              echo "Note: If deployment fails with code 10000, please add CLOUDFLARE_ACCOUNT_ID to GitHub Secrets (found in Cloudflare Dashboard -> Workers & Pages right sidebar)."
            fi
          fi

          # Deploy worker with environment variables injected securely
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            npx wrangler deploy --var "TELEGRAM_BOT_TOKEN:$TELEGRAM_BOT_TOKEN" --var "TELEGRAM_CHAT_ID:$TELEGRAM_CHAT_ID"
          else
            npx wrangler deploy
          fi
          echo "Cloudflare Worker deployed successfully."
