name: Deploy Cloudflare Worker Backend

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Deploy Backend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: backend
        run: npm install

      - name: Deploy Worker to Cloudflare
        working-directory: backend
        env:
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_TOKEN" ]; then
            echo "Error: CLOUDFLARE_TOKEN secret is not configured in repository secrets."
            exit 1
          fi

          # Sanitize inputs by trimming any whitespace or line endings
          CF_TOKEN=$(echo -n "$CLOUDFLARE_TOKEN" | tr -d '\r\n\t ')
          CF_ACCOUNT_ID=$(echo -n "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n\t ')
          TG_BOT_TOKEN=$(echo -n "$TELEGRAM_BOT_TOKEN" | tr -d '\r\n\t ')
          TG_CHAT_ID=$(echo -n "$TELEGRAM_CHAT_ID" | tr -d '\r\n\t ')

          # 1. Cloudflare Token Diagnostic Verification
          echo "Verifying Cloudflare API Token..."
          VERIFY_RES=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify")
          VERIFY_SUCCESS=$(echo "$VERIFY_RES" | jq -r '.success // false')
          VERIFY_STATUS=$(echo "$VERIFY_RES" | jq -r '.result.status // "unknown"')

          if [ "$VERIFY_SUCCESS" = "true" ]; then
            echo "Cloudflare API Token verified successfully (Status: $VERIFY_STATUS)."
          else
            echo "Notice: Cloudflare Token verification returned: $VERIFY_RES"
            echo "If code is 1000, please verify that CLOUDFLARE_TOKEN in GitHub Secrets contains a fresh API Token created via Cloudflare Dashboard -> My Profile -> API Tokens -> Create Token -> Edit Cloudflare Workers template."
          fi

          # 2. Account Discovery / Verification
          ACCOUNTS_RES=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts")
          DISCOVERED_ACCOUNT_ID=$(echo "$ACCOUNTS_RES" | jq -r '.result[0].id // empty')
          ACCOUNT_COUNT=$(echo "$ACCOUNTS_RES" | jq -r '.result | length // 0')

          TARGET_ACCOUNT_ID=""
          if [ -n "$CF_ACCOUNT_ID" ]; then
            TARGET_ACCOUNT_ID="$CF_ACCOUNT_ID"
            echo "Using configured Cloudflare Account ID: ${TARGET_ACCOUNT_ID:0:6}***"
          elif [ -n "$DISCOVERED_ACCOUNT_ID" ] && [ "$DISCOVERED_ACCOUNT_ID" != "null" ]; then
            TARGET_ACCOUNT_ID="$DISCOVERED_ACCOUNT_ID"
            echo "Auto-discovered Cloudflare Account ID: ${TARGET_ACCOUNT_ID:0:6}*** (Total authorized accounts: $ACCOUNT_COUNT)"
          else
            echo "Warning: No account ID discovered from API token. Please verify CLOUDFLARE_ACCOUNT_ID."
          fi

          # Inject account_id directly into wrangler.toml to avoid runtime lookup issues
          if [ -n "$TARGET_ACCOUNT_ID" ]; then
            if ! grep -q "^account_id" wrangler.toml; then
              sed -i "1i account_id = \"$TARGET_ACCOUNT_ID\"" wrangler.toml
            fi
            export CLOUDFLARE_ACCOUNT_ID="$TARGET_ACCOUNT_ID"
          fi

          export CLOUDFLARE_API_TOKEN="$CF_TOKEN"

          # 3. Deploy Worker using Wrangler
          echo "Starting Wrangler deployment..."
          DEPLOY_CMD="npx wrangler deploy"

          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            $DEPLOY_CMD --var "TELEGRAM_BOT_TOKEN:$TG_BOT_TOKEN" --var "TELEGRAM_CHAT_ID:$TG_CHAT_ID"
          else
            $DEPLOY_CMD
          fi

          echo "Cloudflare Worker deployed successfully."
