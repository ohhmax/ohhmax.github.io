name: Deploy to Codeberg Pages

on:
  push:
    branches:
      - main
      - pages

jobs:
  deploy:
    runs-on: codeberg-small
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://ohhmax.codeberg.page/
          token: ${{ forge.token }}
          source: .
