<!-- Reels and shorts vertical explorer modal -->
<div id="reelsExplorerModal" class="reels-explorer-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Vertical Reels Explorer">
  <div class="reels-overlay-bg" id="reelsExplorerBackdrop"></div>
  
  <div class="reels-explorer-container" id="reelsExplorerContainer">
    <!-- Top Action Bar -->
    <div class="reels-top-bar">
      <button type="button" class="reels-back-grid-btn" id="reelsBackGridBtn" aria-label="Back to grid view">
        <i class="fa-solid fa-arrow-left"></i> <span>Grid</span>
      </button>

      <button type="button" class="reels-close-btn" id="reelsExplorerCloseBtn" aria-label="Close explorer">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Main Stage for Real-Time Vertical Swiping Reel -->
    <div class="reels-stage-wrap" id="reelsStageWrap">
      <!-- 3-Slot Real-Time Sliding Track -->
      <div class="reels-track" id="reelsTrack">
        <div class="reel-slide-frame frame-prev" id="reelFramePrev"></div>
        <div class="reel-slide-frame frame-current" id="reelFrameCurrent"></div>
        <div class="reel-slide-frame frame-next" id="reelFrameNext"></div>
      </div>

      <!-- Bottom Left Information Overlay -->
      <div class="reels-info-overlay" id="reelsInfoOverlay">
        <div class="reels-badge-row">
          <span class="reel-folder-badge" id="reelFolderBadge">
            <i class="fa-solid fa-folder"></i> <span id="reelFolderText">Category</span>
          </span>
          <span class="reel-year-chip" id="reelYearChip">Year</span>
        </div>
        <h3 class="reel-title" id="reelTitle">Media Title</h3>
        <p class="reel-desc" id="reelDesc">Detailed engineering description.</p>
        <div class="reel-tags-cloud" id="reelTagsCloud"></div>
      </div>

      <!-- Right Side Floating Controls -->
      <div class="reels-right-dock">
        <button type="button" class="reel-dock-btn" id="reelUpNavBtn" title="Previous" aria-label="Previous item">
          <i class="fa-solid fa-chevron-up"></i>
          <span class="dock-label">PREV</span>
        </button>

        <button type="button" class="reel-dock-btn" id="reelDownNavBtn" title="Next" aria-label="Next item">
          <i class="fa-solid fa-chevron-down"></i>
          <span class="dock-label">NEXT</span>
        </button>

        <button type="button" class="reel-dock-btn" id="reelAudioToggleBtn" title="Toggle Audio" aria-label="Toggle audio">
          <i class="fa-solid fa-volume-high" id="reelAudioIcon"></i>
          <span class="dock-label">SOUND</span>
        </button>

        <a href="#" download id="reelDownloadBtn" class="reel-dock-btn" title="Download High-Res Media" aria-label="Download media">
          <i class="fa-solid fa-arrow-down-to-bracket"></i>
          <span class="dock-label">SAVE</span>
        </a>

        <div class="reel-swipe-hint">
          <i class="fa-solid fa-angles-up anim-swipe-bounce"></i>
          <span>Swipe</span>
        </div>
      </div>
    </div>
  </div>
</div>
